# PID 局部规划器参数
# 底盘：W2A 差速两轮  轮距 ~29 cm
# 算法：纯追踪（Pure Pursuit）+ 运动学逆模型 PID
#
# 核心思路：
#   1. 在全局路径上向前找一个前瞻点（距离 = L）
#   2. 计算机器人到前瞻点的位置误差 e = (ex, ey)
#   3. 通过运动学逆模型把误差转换为 (v, w)：
#        v = cos(θ)*ex + sin(θ)*ey        # 前进速度
#        w = -sin(θ)/l*ex + cos(θ)/l*ey   # 转向角速度
#   4. 对 v/w 做加速度限制后发给底盘
#
# 调参优先级（★越多越常调）：速度★★★ > 前瞻距离★★★ > 到达判定★★ > 增益★

PIDLocalPlanner:

  # ══════════════════════════════════════════════════════
  # 底盘类型
  # ══════════════════════════════════════════════════════
  is_holonomic: false   # 差速车为 false；全向轮小车改为 true

  # ══════════════════════════════════════════════════════
  # 运动学参数
  # ══════════════════════════════════════════════════════
  l: 0.35     # 运动学模型的等效轴距参数 (m)。影响角速度：w = f(e) / l
               # 调大→转弯更温和不摇摆；调小→转弯激进容易振荡
               # W2A 实测：0.35 走直、0.20 以下摇摆明显
  k: 0.8      # 位置误差增益（越大越急，容易超调振荡，0.8~1.0 为佳）
  k_theta: 0.30  # 前瞻点方向权重 (0~1)（此值当前在算法中已融入 theta_d，保留供后续扩展）
  k_rot: 2.0  # 终点旋转比例增益。w = k_rot * e_theta（P控制器）
               # 调大→对准更快但可能超调；调小→更慢但精准
               # e_theta=0.3rad时 w=0.6rad/s（自然减速），vs原来的w=max_w=1.0（匀速超调）

  # ══════════════════════════════════════════════════════
  # 前瞻距离  ★★★ 最关键的调参
  # L = clamp(|v| * lookahead_time, min, max)
  # 低速时用 min_lookahead_dist，高速时用 max_lookahead_dist
  # ══════════════════════════════════════════════════════
  lookahead_time: 0.8        # 前瞻时间 (s)，L = 速度 × 时间
  min_lookahead_dist: 0.55   # 前瞻距离下限 (m)
                              # 调小→低速时跟路径更精确，但容易抖动
                              # 调大→走直线更稳，但小转弯可能切角
  max_lookahead_dist: 1.50   # 前瞻距离上限 (m)

  # ══════════════════════════════════════════════════════
  # 速度限制  ★★★
  # ══════════════════════════════════════════════════════
  max_v: 0.65      # 最大线速度 (m/s)。适当降低有助于减少振荡
  min_v: 0.0       # 最小线速度 (m/s)。0 = 允许原地停止
  max_v_inc: 0.5   # 每控制周期最大线加速度 (m/s²)。调小→启动更平稳

  max_w: 1.2       # 最大角速度 (rad/s)。降低可减少甩头振荡
  min_w: 0.0       # 最小角速度，0 = 走直线时不强制旋转
  max_w_inc: 0.8   #

  # ══════════════════════════════════════════════════════
  # 转弯降速
  # 转弯时线速度衰减：attenuation = clamp(1 - |w|/max_w, ratio, 1.0)
  # ══════════════════════════════════════════════════════
  min_turn_vel_ratio: 0.25   # 最大角速度时保留的线速度比例
                              # 0.25 → 急转弯时线速度最低降到 max_v * 0.25

  # ══════════════════════════════════════════════════════
  # odom 话题（加速度限制用，不影响定位）
  # zoo_driver 发布到 /odom，坐标系名叫 odom_combined
  # ══════════════════════════════════════════════════════
  odom_topic: "/odom"

  # ══════════════════════════════════════════════════════
  # 到达判定  ★★
  # ══════════════════════════════════════════════════════
  xy_goal_tolerance: 0.15   # 位置到达容差 (m)。调小→停得更准；过小可能反复抖动
  yaw_goal_tolerance: 0.20  # 朝向到达容差 (rad ≈ 11°)。调小→最终朝向更准
  rotate_tolerance: 0.5     # 原地旋转对准终点时的角度容差 (rad)

